<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style><meta name="theme-color" content="#150A0C"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="پلنر غزال"><title>پلنر غزال</title></head><body>
<title>پلنر غزال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: right sidebar + content. Today opens with a hero band (felt character video that follows the pointer) holding greeting, energy and the one focus card; below it a work column and a now-to-night rail. */
:root{
  /* one committed look: the welcome screen's deep wine red, glass surfaces, white pill buttons, three pastels for the plan cards */
  --bg:#150A0C; --surface:#25161A; --panel:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03)); --sunk:rgba(255,255,255,.08); --fg:#F7F0EC; --fg2:#DCCFCA; --muted:#AA9C97; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.2);
  --accent:#86DDB8; --accent-fg:#0E2219; --accent-soft:rgba(134,221,184,.14); --accent-line:rgba(134,221,184,.38);
  --ink:#ffffff; --ink-fg:#1a0001;
  --saffron:#F0C36A; --saffron-soft:rgba(240,195,106,.14); --rose:#FF9F8C; --rose-soft:rgba(255,159,140,.14); --calm:#AEC6E8; --calm-soft:rgba(174,198,232,.12);
  --lilac:#D9CCFB; --mint:#AEE7CF; --butter:#FBE08A; --pastel-fg:#18191B; --violet:#A99BF7;
  --hero:#4a0002; --mark:#C8322F;
  --e1:#3B2A2D; --e2:#3F6B5A; --e3:#5BAE8E; --e4:#86DDB8;
  --j1:#5B9DF0; --j2:#F08A52; --j3:#3CC79A; --j4:#F0B93A; --j5:#F090B5; --j6:#6FCF6F; --j7:#A99BF7; --j8:#F07A78;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --r:16px; --r-m:11px; --r-s:6px;
  --sh1:inset 0 1px 0 rgba(255,255,255,.07); --sh2:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 620px at 88% -8%,#5a0d12 0%,rgba(90,13,18,0) 62%),radial-gradient(900px 600px at 0% 100%,#2a0f1f 0%,rgba(42,15,31,0) 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:26px;font-weight:700;margin:0;line-height:1.4;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0}
h3{font-size:15px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- frame ---------- */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 12px 14px;border-inline-end:1px solid var(--line);overflow-y:auto;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;padding:2px 10px 14px}
.logo b{width:24px;height:24px;border-radius:8px;background:var(--mark);position:relative;flex:none}
.logo b::before,.logo b::after{content:"";position:absolute;top:8px;width:5px;height:7px;border-radius:50%;background:#fff}
.logo b::before{left:6px} .logo b::after{right:6px}
#nav,#nav2{display:flex;flex-direction:column;gap:2px}
#nav button,#nav2 button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:var(--r-m);background:transparent;color:var(--fg2);font-size:14.5px;text-align:start;white-space:nowrap;transition:background-color .15s var(--ease)}
#nav button:hover,#nav2 button:hover{background:var(--sunk)}
#nav button[aria-current="true"],#nav2 button[aria-current="true"]{background:rgba(255,255,255,.12);color:#fff;font-weight:500;box-shadow:var(--sh1)}
#nav button em{margin-inline-start:auto;font-style:normal;font-size:12px;background:var(--lilac);color:var(--pastel-fg);border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.subn{display:flex;flex-direction:column;gap:1px;padding-inline-start:28px;margin-bottom:4px}
#nav .subn button{height:30px;font-size:13.5px;color:var(--muted)}
#nav .subn button[aria-current="true"]{background:transparent;box-shadow:none;color:var(--fg);font-weight:700}
.sgrow{flex:1;min-height:12px}
#fab{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r-m);border:1px dashed var(--line2);background:transparent;color:var(--fg2);font-size:14px}
#fab:hover{background:rgba(255,255,255,.1);border-style:solid}
#fab kbd{margin-inline-start:auto}
kbd{background:var(--sunk);border-radius:5px;padding:0 6px;font-family:inherit;font-size:11.5px;color:var(--muted)}
#timer{background:var(--panel);border:1px solid var(--line2);color:var(--fg);backdrop-filter:blur(14px);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-size:13px}
#timer>span{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
#timer b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
#timer .btn{height:28px;padding:0 10px;font-size:12.5px}
#timer .btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
#timer .btn:nth-of-type(n+2){grid-column:auto}
#content{min-width:0;overflow-x:clip;padding:24px 32px 96px;display:flex;flex-direction:column;gap:24px;max-width:1240px;width:100%;margin:0 auto}
main{display:flex;flex-direction:column;gap:24px;min-width:0}
.subnav{display:none}

/* ---------- hero (Today) ---------- */
#hero{position:relative;border-radius:22px;overflow:hidden;background:var(--hero);color:#fff;min-height:348px;display:flex;box-shadow:var(--sh1)}
#heroVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:0% 14%}
#hero.novid #heroVid{display:none}
.hshade{position:absolute;inset:0;background:linear-gradient(to left,rgba(40,0,2,.82) 0%,rgba(40,0,2,.55) 38%,rgba(40,0,2,0) 62%);pointer-events:none}
#heroBody{position:relative;z-index:1;margin-inline-end:auto;width:min(100%,520px);padding:26px 28px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#hero h1{font-size:30px}
.hsub{font-size:14px;opacity:.8}
.hen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.hen>span{opacity:.85}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-size:13.5px;color:var(--fg2);height:30px;padding:0 13px;border-radius:999px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button.on{background:#fff;color:#1a0001;font-weight:500}
#hero .seg{background:rgba(255,255,255,.14);backdrop-filter:blur(10px)}
#hero .seg button{color:rgba(255,255,255,.85)}
#hero .seg button[aria-pressed="true"]{background:#fff;color:#1a0001;box-shadow:none}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;opacity:.85}
.glass h2{font-size:21px;line-height:1.55;overflow-wrap:anywhere}
.glass .step{background:rgba(0,0,0,.22);border-radius:var(--r-m);padding:7px 12px;font-size:14px;overflow-wrap:anywhere}
.glass .step span{opacity:.7}
#hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
#hero .btn:hover{background:rgba(255,255,255,.22)}
#hero .btn.pri{background:#fff;border-color:#fff;color:#1a0001}
#hero .btn.pri:hover{background:#f1e9e9}
#hero .btn.on{background:#fff;color:#1a0001}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hbtns .btn{height:28px;font-size:12.5px;padding:0 10px}
.hprog{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.9}
.hprog .bar{flex:1;max-width:160px;background:rgba(255,255,255,.2);height:6px}
.hprog .bar i{background:#fff}

/* ---------- common ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.cols>div{display:flex;flex-direction:column;gap:24px;min-width:0}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.cols>aside{position:sticky;top:24px}}
aside.rail{min-width:0;display:flex;flex-direction:column;gap:22px}
aside.rail h2{font-size:14px;font-weight:500;color:var(--fg2)}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.head p{max-width:68ch}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh1);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--calm-soft);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font-size:14px}
.note.warm{background:var(--saffron-soft)}
.card.recover{background:var(--calm-soft);border-color:transparent}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
ul.list{background:var(--panel);box-shadow:var(--sh1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 16px;min-width:0;min-height:58px;border-bottom:1px solid var(--line);transition:background-color .15s var(--ease)}
ul.list>.task:last-child{border-bottom:0}
ul:not(.list)>.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.task:hover{background-color:rgba(255,255,255,.05)}
.task.run{box-shadow:inset -3px 0 0 var(--violet)}
.task.done .ttitle{text-decoration:line-through;color:var(--muted);font-weight:400}
.chk{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;color:var(--accent-fg);font-weight:700;font-size:12px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,background-color .15s}
.chk:hover{border-color:var(--accent)}
.chk svg.i{width:14px;height:14px;stroke-width:3}
.task.done .chk,.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tbody{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px}
.ttitle{font-weight:500;overflow-wrap:anywhere}
.ttitle[data-a]{cursor:pointer}
.ttitle[data-a]:hover{text-decoration:underline dotted;text-underline-offset:4px}
.next{font-size:13.5px;color:var(--fg2);overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.acts{display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .15s}
.task:hover .acts,.task:focus-within .acts,.task.open .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.task .more{flex:1 1 100%;padding-inline-start:34px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;border:1px solid var(--line2);background:rgba(255,255,255,.06);border-radius:999px;padding:0 14px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .1s}
.btn svg.i{width:15px;height:15px}
.btn:hover{background:rgba(255,255,255,.15)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.pri:hover{background:#eadfdf}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line)}
.btn.warn{color:var(--rose);border-color:transparent;background:transparent}
.btn.warn:hover{background:var(--rose-soft)}
.btn.big{height:42px;padding:0 20px;font-size:15px}
.btn.icon{width:32px;padding:0}
.btn.sm{height:26px;padding:0 10px;font-size:12.5px}
.fixed{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fixed:last-child{border-bottom:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;flex:none;min-width:92px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:var(--r-s);padding:0 8px;font-size:12.5px;height:22px;white-space:nowrap}
.chip.hot{background:var(--rose-soft);color:var(--rose)} .chip.soon{background:var(--saffron-soft);color:var(--saffron)}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
form.card{flex-direction:row;flex-wrap:wrap;align-items:flex-end}
form.card>h2,form.card>p,form.card>.full,form.card>details{flex:1 1 100%}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
label.grow{flex:1 1 200px} label.full{flex:1 1 100%}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14.5px}
input,select,textarea{background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:var(--r-m);padding:0 12px;min-width:0;max-width:100%;height:38px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=checkbox]{height:auto;padding:0;accent-color:var(--accent);width:16px;height:16px}
input[type=file]{height:auto;padding:8px;border-style:dashed}
input[type=number]{width:84px} textarea{width:100%;min-height:96px;height:auto;padding:10px 12px;resize:vertical}
details>summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details[open]>summary{margin-bottom:10px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{flex-direction:row;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 12px;color:var(--fg);cursor:pointer}
.days label:has(input:checked){background:var(--accent-soft)}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.bar i.t{background:var(--e2)}
.quick{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px;gap:6px;align-items:center;flex-wrap:nowrap}
.quick>svg{color:var(--muted);margin-inline-start:10px}
.quick input[name=title]{flex:1;border:0;height:36px;padding:0 6px;box-shadow:none;background:transparent}
.quick:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.quick .seg button{height:28px;padding:0 10px;font-size:12.5px}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.rh{display:flex;flex-direction:column;gap:8px;min-width:0}
.rh h3{font-size:13px;font-weight:500;color:var(--muted)}
.exp{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.exp b{font-size:14px;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty svg.i{width:28px;height:28px;color:var(--line2)}

/* ---------- week ---------- */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start}
@media (min-width:1280px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.week.cur{grid-template-columns:repeat(8,minmax(0,1fr))}.week.cur .day.today{grid-column:span 2}}
.day *{overflow-wrap:anywhere;max-width:100%}.day .chip{white-space:normal;height:auto;min-height:22px;padding:2px 8px;line-height:1.5}.day .row{flex-wrap:wrap;min-width:0}
.day{border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;font-size:13px;border:1px solid transparent}
.day:hover{background:rgba(255,255,255,.03)}
.day.today{background:var(--panel);border-color:var(--line2);box-shadow:var(--sh1)}
.day.isoff{opacity:.6}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.dhead b{display:block;font-size:14.5px}
.dhead span{color:var(--muted);font-size:12px}
.day.today .dhead b::after{content:"امروز";font-size:11px;font-weight:500;background:var(--ink);color:var(--ink-fg);border-radius:999px;padding:1px 7px;margin-inline-start:6px}
.cap{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.cap .bar{height:5px}
.day.full .cap .bar i{background:var(--saffron)}
.day.full .cap span{color:var(--saffron)}
.fx{background:var(--sunk);border-inline-start:3px solid var(--fg2);border-radius:var(--r-s);padding:4px 8px;line-height:1.5}
.fx .time{display:block;min-width:0;font-size:11.5px}
.day ul{gap:2px}
.day li{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-radius:var(--r-s);line-height:1.6}
.day li:hover{background:var(--sunk)}
.day li span[data-a]{cursor:pointer;overflow-wrap:anywhere;min-width:0}
.day .chk{width:18px;height:18px;border-radius:6px;font-size:11px;margin-top:2px}
.day li.done span{text-decoration:line-through;color:var(--muted)}
.day .chip{font-size:11.5px;min-height:20px}

/* ---------- plans hub ---------- */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.hubc{position:relative;border:0;border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;color:var(--pastel-fg);min-height:230px;transition:transform .25s var(--ease)}
.hubc:hover{transform:translateY(-4px)}
.hubc.lilac{background:var(--lilac)} .hubc.mint{background:var(--mint)} .hubc.butter{background:var(--butter)}
.hubc>svg.i{width:54px;height:54px;stroke-width:1.2;margin-bottom:auto}
.hubc .tagx{font-size:12px;border:1px solid currentColor;border-radius:999px;padding:0 10px;height:22px;display:inline-flex;align-items:center}
.hubc b{font-size:18px}
.hubc>span.d{font-size:13.5px;opacity:.8;line-height:1.6}
.hubc .go{display:inline-flex;align-items:center;gap:8px;background:#18191B;color:#fff;border-radius:999px;height:34px;padding:0 14px 0 4px;font-size:13.5px;font-weight:500;margin-top:6px}
.hubc .go i{width:26px;height:26px;border-radius:50%;background:#fff;color:#18191B;display:inline-flex;align-items:center;justify-content:center}
.hubc .go svg.i{width:14px;height:14px}
.eyes{position:absolute;top:16px;inset-inline-end:16px;display:flex;gap:2px}
.eyes i{width:16px;height:18px;border-radius:50%;background:#fff;border:1.5px solid #18191B;position:relative;display:block}
.eyes i::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#18191B;left:50%;top:50%;margin:-3.5px;transform:translate(var(--ex,0px),var(--ey,0px))}

/* ---------- goals / pacts ---------- */
.pact{font-size:17px;font-weight:700}
.stat{display:flex;flex-wrap:wrap;gap:12px 32px}
.stat div{display:flex;flex-direction:column}
.stat b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.4}

/* ---------- timeline ---------- */
.tl{position:relative;border-inline-start:1px solid var(--line);margin-inline-start:44px;overflow:visible}
.tl .hr{position:absolute;inset-inline-start:-44px;width:38px;text-align:end;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-50%);line-height:1}
.tl .blk{position:absolute;inset-inline:8px 0;border-radius:var(--r-s);padding:2px 8px;font-size:12.5px;overflow:hidden;line-height:1.5}
.tl .blk.fx{background:var(--sunk);color:var(--fg);border-inline-start:3px solid var(--fg2);border-radius:var(--r-s)}
.tl .blk.tk{border:1px dashed var(--accent-line);background:var(--accent-soft)}
.tl .now{position:absolute;inset-inline:-4px 0;border-top:1.5px solid var(--rose);z-index:2}
.tl .now span{position:absolute;inset-inline-end:0;top:-10px;background:var(--rose);color:#fff;font-size:10.5px;border-radius:999px;padding:0 6px;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mini{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.mini .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bmini{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
.bmini .b{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere;cursor:pointer}
.bmini .b span{display:block;color:var(--muted);font-size:12.5px}
.bmini .cover{width:32px;height:46px;font-size:15px;border-radius:3px}

/* ---------- library ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:#fff;border-color:#fff;font-weight:500}
.shelfwrap{overflow-x:auto;overflow-y:hidden;padding:44px 0 26px;perspective:1400px;scrollbar-width:thin}
.shelf{display:flex;align-items:flex-end;gap:4px;height:300px;padding:0 20px;border-bottom:10px solid var(--line2);position:relative;min-width:max-content}
.spine{flex:none;width:46px;border:0;border-radius:3px 3px 2px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 8px;color:#fff;font-size:13px;font-weight:500;background:hsl(var(--h) 38% 36%);box-shadow:inset -3px 0 0 rgba(0,0,0,.14),inset 2px 0 0 rgba(255,255,255,.14);transition:transform .35s var(--ease)}
.spine:hover{transform:translateY(-10px)}
.spine .st{writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:82%}
.spine .pg{font-size:10px;opacity:.85;font-variant-numeric:tabular-nums}
.cover3d{flex:none;width:190px;height:284px;margin:0 22px 0 14px;border-radius:4px 8px 8px 4px;background:hsl(var(--h) 38% 36%);color:#fff;padding:20px 16px 18px 24px;display:flex;flex-direction:column;justify-content:space-between;position:relative;cursor:pointer;box-shadow:-18px 24px 40px rgba(24,25,27,.3);transform:rotateY(-14deg) rotateZ(-2deg) translateY(-22px);animation:pull .5s var(--ease)}
.cover3d::before{content:"";position:absolute;inset:0 auto 0 0;width:12px;background:rgba(0,0,0,.2);border-radius:4px 0 0 4px}
.cover3d:hover{transform:rotateY(-8deg) rotateZ(-1deg) translateY(-28px)}
.cover3d .au{font-size:12px;opacity:.85}
.cover3d .ti{font-size:24px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.cover3d .pr{display:flex;align-items:center;gap:8px;font-size:12.5px}
@keyframes pull{from{transform:rotateY(-80deg) translateY(0)}}
.bcap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 24px}
.bcap h2{font-size:24px;overflow-wrap:anywhere}
.book{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.cover{flex:none;width:54px;height:76px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff}
.ring{flex:none}
main.sheet>*{animation:sheet .35s var(--ease) backwards}
@keyframes sheet{from{transform:translateY(14px) scale(.985);clip-path:inset(0 0 40% 0)}}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart rect.b{fill:var(--accent)} .chart rect.b:hover{fill:var(--e3)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13.5px}
.hb .tr{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex;gap:2px}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hb .tr i.t{background:var(--e2)} .hb .tr i.m{background:transparent}
.hb .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--sunk);font-style:normal;font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cal i.e1{background:var(--e1)} .cal i.e2{background:var(--e2)} .cal i.e3{background:var(--e3);color:#10201a} .cal i.e4{background:var(--e4);color:#10201a}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
body[data-tab="dash"] main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
body[data-tab="dash"] main>.head,body[data-tab="dash"] main>.card:first-of-type{grid-column:1/-1}

/* ---------- floating pieces ---------- */
#toast{position:fixed;z-index:11;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font-size:14px;box-shadow:var(--sh2);animation:rise .25s var(--ease)}
#toast .btn{background:transparent;color:var(--ink-fg);border-color:rgba(26,0,1,.3);height:28px}
@keyframes rise{from{transform:translate(-50%,12px)}}
#remind{position:fixed;z-index:11;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--saffron-soft);color:var(--fg);border:1px solid var(--saffron);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--sh2)}
#modal,#focus{position:fixed;inset:0;z-index:9;background:rgba(10,10,10,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal{backdrop-filter:blur(4px)}
#modal .card{background:#2A171B;max-width:520px;width:100%;max-height:92%;overflow:auto;box-shadow:var(--sh2);border-radius:20px;padding:24px;animation:pop .2s var(--ease)}
@keyframes pop{from{transform:scale(.97)}}
#focus{z-index:8;background:#0C0C0E;color:#F4F4F2;--fg:#F4F4F2;--muted:#A3A3A0;--surface:#1A1A1D;--sunk:#26262A;--line2:#3A3A40;--line:#2C2C31;--ink:#F4F4F2;--ink-fg:#0C0C0E;--accent:#A99BF7;--accent-soft:#2B2647;--accent-line:#4A417A}
#focus .box{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
#focus h1{font-size:30px;overflow-wrap:anywhere}
.ringwrap{position:relative;width:250px;height:250px;display:flex;align-items:center;justify-content:center}
.ringwrap .ringbig{position:absolute;inset:0;width:100%;height:100%}
#focus .clock{font-size:50px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#focus form{justify-content:center;width:100%}
.ringbig circle{fill:none;stroke-width:9}
.ringbig .bg{stroke:#2A2A30} .ringbig .fg{stroke:var(--violet);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.joys{display:flex;flex-wrap:wrap;gap:8px}
.joy{border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:999px;height:34px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;transition:background-color .15s,border-color .15s}
.joy:hover{border-color:var(--jc)}
.joy i,.dots i,.jdot{width:10px;height:10px;border-radius:50%;background:var(--jc);flex:none;display:inline-block}
.joy.on{border-color:var(--jc);background:color-mix(in srgb,var(--jc) 26%,transparent)}
.dots{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.jgrid{display:grid;gap:3px 2px;align-items:center;font-size:13px}
.jgrid>span{padding-inline-end:8px;overflow-wrap:anywhere;min-width:0}
.jgrid>i{height:18px;border-radius:4px;background:var(--sunk);min-width:0}
.jgrid>i.on{background:var(--jc)}
.jgrid>i.na{background:transparent;border:1px dashed var(--line)}
.jgrid>em{font-style:normal;font-size:10px;color:var(--muted);text-align:center;overflow:hidden;white-space:nowrap}

/* ---------- small screens ---------- */
@media (max-width:900px){
  #app{display:block}
  #side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;gap:4px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:#1c0d10;border:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .logo span,.sgrow,.subn,#fab kbd,#nav2 button span{display:none}
  .logo{padding:0 4px}
  #nav,#nav2{flex-direction:row}
  #nav button{height:34px;padding:0 10px;font-size:13.5px}
  #nav button svg.i{display:none}
  #fab{position:fixed;z-index:6;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--ink-fg);border:0;border-radius:999px;box-shadow:var(--sh2)}
  #timer{position:fixed;inset:auto 0 0 0;z-index:7;border-radius:0;background:#2A171B;display:flex;flex-wrap:wrap;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  #timer>span{flex:none;max-width:40vw}
  #content{padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));gap:18px}
  .subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  #hero{min-height:0;flex-direction:column;border-radius:18px}
  #heroVid{position:relative;height:210px;object-position:8% 22%}
  .hshade{background:linear-gradient(to top,var(--hero) 0%,var(--hero) 52%,rgba(40,0,2,0) 78%)}
  #heroBody{width:100%;padding:0 16px 18px;margin-top:-36px}
  #hero h1{font-size:24px}
  .htop{flex-direction:column;gap:8px}
  .hbtns{display:flex;flex-wrap:wrap;gap:6px}
  .quick{flex-wrap:wrap}
  h1{font-size:22px}
  .cover3d{width:150px;height:226px}.cover3d .ti{font-size:19px}.shelf{height:250px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cover3d{transform:translateY(-12px)}}

/* ---------- motion: entrance, bars, live dot ---------- */
main.fresh>*{animation:enter .7s var(--ease) backwards}
main.fresh>*:nth-child(2){animation-delay:.06s} main.fresh>*:nth-child(3){animation-delay:.12s} main.fresh>*:nth-child(4){animation-delay:.18s} main.fresh>*:nth-child(n+5){animation-delay:.24s}
@keyframes enter{from{opacity:0;transform:translateY(22px)}}
main.fresh .bar i,main.fresh .hb .tr i{animation:grow 1.2s var(--ease) backwards .2s}
@keyframes grow{from{width:0}}
#hero.fresh h1,#hero.fresh .hsub{animation:mask .9s var(--ease) backwards .15s}
#hero.fresh .glass{animation:enter .9s var(--ease) backwards .35s}
@keyframes mask{from{clip-path:inset(0 0 100% 0);transform:translateY(60%)}to{clip-path:inset(0 0 -20% 0)}}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.card,.hubc,.bmini,.exp{transition:transform .4s var(--ease),border-color .3s}
.ghost{font-weight:700;font-size:clamp(56px,11vw,150px);line-height:1;text-align:center;letter-spacing:-.03em;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;pointer-events:none;margin-top:24px;white-space:nowrap;overflow:hidden}
.linkarrow{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.linkarrow svg.i{transition:transform .3s var(--ease)}
.linkarrow:hover svg.i{transform:translateX(-4px)}

/* ---------- welcome screen ---------- */
#welcome{position:fixed;inset:0;z-index:50;background:var(--hero);color:#fff;transition:opacity .5s ease,visibility .5s}
#welcome.gone{opacity:0;visibility:hidden;pointer-events:none}
#wVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:20% center}

@keyframes blink{50%{opacity:0}}
.wpills{display:flex;flex-wrap:wrap;gap:8px 6px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.wpills.show{opacity:1;transform:none}

/* ---- 2026-11-13: glowing programme cards, mood faces, pictures, course links ---- */
:root{--m1:#F27C7C;--m2:#B3A6F5;--m3:#93C7F0;--m4:#AEDB7F;--m5:#F8D94E;
  --g1:linear-gradient(137deg,#FF3D77 0%,#FFB1CE 45%,#FF9D3C 100%);--g2:linear-gradient(137deg,#FFFFFF 0%,#7DD3FC 45%,#06B6D4 100%);--g3:linear-gradient(137deg,#4361EE 0%,#E0AEFF 45%,#F72585 100%);
  --g4:linear-gradient(137deg,#86DDB8 0%,#D9F99D 45%,#FACC15 100%);--g5:linear-gradient(137deg,#C8322F 0%,#FF9F8C 45%,#F0C36A 100%);--g6:linear-gradient(137deg,#A99BF7 0%,#C4B5FD 45%,#38BDF8 100%);--g7:linear-gradient(137deg,#F472B6 0%,#FDE68A 45%,#34D399 100%)}

/* programme page head + stat tiles */
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pico{flex:none;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;border:3px solid transparent;background:linear-gradient(#1C1114,#1C1114) padding-box,var(--g) border-box;box-shadow:0 0 34px -10px rgba(255,120,160,.55)}
.pico svg.i{width:26px;height:26px;stroke-width:2.2}
.pt{flex:1 1 260px;min-width:0;display:flex;flex-direction:column}
.pt h1{line-height:1.3}
.crumb{align-self:flex-start;background:none;border:0;padding:0;font-size:12.5px;color:var(--muted)}
.crumb:hover{color:var(--fg);text-decoration:underline}
.crumb::after{content:" ‹"}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--sh1);animation:enter .6s var(--ease) backwards}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}
.tile b{font-size:28px;line-height:1.3;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b i{font-style:normal;font-size:15px;font-weight:400;color:var(--muted)}
.tile.txt b{font-size:17px;line-height:2.15}
.tile span{font-size:13px;color:var(--fg2)}
.tile small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.hot{background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border-color:var(--line2)}
.addp{border-color:var(--accent-line);background:linear-gradient(160deg,rgba(134,221,184,.09),rgba(255,255,255,.03));animation:enter .35s var(--ease)}
.addp form{width:100%}
.addp h3{margin-top:4px}
.pbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.pbody>p,.pbody>ul,.pbody>.empty{grid-column:1/-1}
.pbody>ul{list-style:none;margin:0;padding:0}
.p-routines>.sec:first-child,.p-joys>.sec:first-child,.p-deadlines>*{grid-column:1/-1}
.pbody .sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.empty b{color:var(--fg);font-size:16px}
/* goal cards */
.glh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.glt{flex:1 1 160px;min-width:0}
.glt h2{overflow-wrap:anywhere}
.nstep{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:var(--r-m);padding:10px 12px}
.nsb{flex:1;min-width:0;display:flex;flex-direction:column}
.nsb b{cursor:pointer;overflow-wrap:anywhere;font-weight:500}
.steps ul{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}

/* thoughts */
.tagpick{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:6px}
.tg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:13.5px;color:var(--fg2);transition:background-color .15s,border-color .15s,color .15s}
.tg svg.i{width:15px;height:15px;color:var(--tc)}
.tg:hover{border-color:var(--tc)}
.tg[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#16090b;font-weight:700}
.tg[aria-pressed="true"] svg.i{color:#16090b}
.tagpick.mini .tg{height:26px;padding:0 9px;font-size:12px}
.tagpick.mini .tg svg.i{width:13px;height:13px}
#modal form>.full{flex:1 1 100%}
.ibar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ibar .seg{flex-wrap:wrap;border-radius:20px}
.isearch{flex-direction:row;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:0 14px;height:36px;flex:0 1 260px}
.isearch input{background:none;border:0;outline:0;height:100%;flex:1;min-width:0;padding:0}
.iboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
.iboard.one{grid-template-columns:minmax(0,720px)}
.icol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:3px solid var(--tc)}
.icol header{display:flex;align-items:center;gap:8px}
.icol header h2{font-size:15px}
.icol header em{font-style:normal;font-size:12px;color:var(--muted);margin-inline-end:auto}
.idot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 22%,transparent);color:var(--tc)}
.idot svg.i{width:16px;height:16px}
.icol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.icard{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;transition:border-color .15s,transform .15s var(--ease)}
.icard:hover{border-color:var(--line2);transform:translateY(-1px)}
.icard.star{border-color:var(--saffron)}
.icard .chk{margin-top:3px}
.icard .chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.ib{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.itx{cursor:pointer;overflow-wrap:anywhere;line-height:1.6}
.icard.done .itx{text-decoration:line-through;opacity:.5}
.istar{flex:none;background:none;border:0;padding:2px;color:var(--line2);opacity:0;transition:opacity .15s,color .15s}
.icard:hover .istar,.istar:focus-visible,.istar[aria-pressed="true"]{opacity:1}
.istar[aria-pressed="true"]{color:var(--saffron)}
.istar[aria-pressed="true"] svg.i{fill:currentColor}
@media (hover:none){.istar{opacity:1}}
.iemp{border:1px dashed var(--line);border-radius:var(--r-m);padding:10px;text-align:center}

/* welcome: date, glance card, inline capture */
.wintro{display:none}
.wlinks{gap:18px}
.whero{width:min(100%,560px);gap:0}
.wdate{font-size:14px;opacity:.8;margin-bottom:6px}
.wtyped{min-height:3.4em;margin-bottom:14px}
.wbody{display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.wbody.show{opacity:1;transform:none}
.wbody .wpills{opacity:1;transform:none}
.wglance{background:rgba(20,0,2,.42);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wnow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wnb{flex:1 1 200px;min-width:0;display:flex;flex-direction:column}
.wnb b{font-size:19px;line-height:1.5;overflow-wrap:anywhere}
.wmeta{font-size:13px;opacity:.75}
.wgo{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#1a0001;font-weight:700;font-size:15px;white-space:nowrap;transition:transform .15s var(--ease)}
.wgo:hover{transform:scale(1.04)}
.wgo svg.i{width:16px;height:16px;fill:currentColor}
.wgo kbd,.wcap kbd{background:rgba(0,0,0,.1);color:inherit;opacity:.7}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips:empty{display:none}
.wchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:30px;padding:0 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-size:13px;transition:background-color .15s}
.wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip svg.i{width:14px;height:14px;opacity:.8}
.wchip:hover{background:rgba(255,255,255,.22)}
.wcap{position:relative;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:0 16px;height:46px;color:#1a0001}
.wcap input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;color:#1a0001;font-size:15px;padding:0}
.wcap input::placeholder{color:rgba(26,0,1,.55)}
.wcap:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.wok{position:absolute;inset-inline-end:14px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:1px 12px;font-size:13px;font-weight:700}

/* phone: bottom tab bar, bigger tap targets */
@media (max-width:900px){
  .monly{display:flex!important}
  .donly{display:none!important}
  #side{justify-content:space-between}
  .logo span{display:inline;font-size:15px}
  #nav2{gap:2px}
  #nav2 button{width:40px;height:40px;padding:0;justify-content:center}
  #nav{position:fixed;z-index:8;inset:auto 0 0 0;display:flex;flex-direction:row;justify-content:space-around;gap:0;background:#1c0d10;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));overflow:visible}
  #nav button{flex:1 1 0;min-width:0;height:50px;padding:0 2px;flex-direction:column;justify-content:center;gap:2px;font-size:11px;position:relative;border-radius:12px}
  #nav button svg.i{display:block;width:21px;height:21px}
  #nav button em{position:absolute;top:2px;inset-inline-start:calc(50% + 4px);margin:0;min-width:17px;height:17px;font-size:10.5px;padding:0 4px}
  #nav button[aria-current="true"]{background:none;box-shadow:none;color:var(--accent)}
  #fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;padding:0;justify-content:center;font-size:0;gap:0}
  #fab svg.i{width:22px;height:22px}
  #timer{bottom:calc(63px + env(safe-area-inset-bottom,0px))}
  #content{padding-bottom:170px}
  #toast{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
  input,select,textarea{font-size:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile b{font-size:22px}.tile.txt b{font-size:15px;line-height:1.95}
  .pbody{grid-template-columns:minmax(0,1fr)}
  .phead .btn.big{flex:1 1 100%}
  .pico{width:46px;height:46px;border-radius:16px}
  .iboard{grid-template-columns:minmax(0,1fr)}
  .isearch{flex:1 1 100%}
  .wnav{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
  .wlinks{display:none}
  .whero{padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;justify-content:flex-end}
  #wVid{object-position:22% 0;height:50%}
  .wshade{background:linear-gradient(to top,var(--hero) 0%,var(--hero) 36%,rgba(74,0,2,.85) 50%,rgba(74,0,2,0) 66%)}
  .wtyped{min-height:0;font-size:18px}
  .wpill kbd,.wgo kbd,.wcap kbd{display:none}
}

/* sleep */
.hsleep>span:first-child{display:inline-flex;align-items:center;gap:6px}.hsleep>span:first-child svg.i{width:15px;height:15px}
.hsleep .hint{font-size:12.5px;opacity:.75}
.slchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.slchip i{font-style:normal;font-weight:400;opacity:.75;font-size:12px}
.slchip.good{background:rgba(255,255,255,.9);color:#1a0001;border-color:transparent}
.slchip.low{border-style:dashed}
.slchip:hover{background:rgba(255,255,255,.26)}.slchip.good:hover{background:#fff}
.slwrap{position:relative;flex:0 0 100%;max-width:100%;height:270px;margin:2px 0 6px}
#modal form[data-form="sleep"]>label{flex:1 1 130px}
#sl-dial{display:block;width:270px;max-width:100%;height:100%;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;direction:ltr}
#sl-dial .dtrack{fill:none;stroke:var(--sunk);stroke-width:30}
#sl-dial .darc{fill:none;stroke:var(--accent);stroke-width:30;stroke-linecap:round;transition:stroke .2s}
#sl-dial.short .darc{stroke:var(--warn,#b8862b)}
#sl-dial .tk{stroke:var(--muted);stroke-width:1;opacity:.35}
#sl-dial .tkb{stroke:var(--muted);stroke-width:1.5;opacity:.7}
#sl-dial .dl{fill:var(--muted);font-size:11px;font-family:inherit}
#sl-dial .dh{cursor:grab;outline:none}
#sl-dial .dh>circle:first-child{fill:#fff;stroke:rgba(0,0,0,.12);stroke-width:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
#sl-dial .dh path{fill:#1a0001}
#sl-dial .dh circle.sun{fill:#b8862b}#sl-dial .dh path.sun{fill:none;stroke:#b8862b;stroke-width:1.4;stroke-linecap:round}
#sl-dial .dh:focus-visible>circle:first-child{stroke:var(--accent);stroke-width:3}
.slmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding-top:6px}
.slmid b{font-size:34px;letter-spacing:.02em;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.slmid span{font-size:11.5px;color:var(--muted);max-width:96px;line-height:1.5}
.slbars{position:relative;display:flex;align-items:flex-end;gap:3px;height:110px;margin:16px 0 8px}
.slbars::after{content:"";position:absolute;inset-inline:0;bottom:var(--gl);border-top:1.5px dashed var(--muted);opacity:.55;pointer-events:none}
.slbars i{flex:1 1 0;min-width:3px;border-radius:5px 5px 2px 2px;background:var(--muted);opacity:.55}
.slbars i.ok{background:var(--good,#3f7d58);opacity:1}
.slbars i.lo{background:var(--warn,#b8862b);opacity:.9}
.slbars i.na{background:var(--sunk);opacity:1}
.slcard .stat{margin-top:6px}
.slcard .stat b i{font-style:normal;font-size:14px;font-weight:400;color:var(--muted)}
.wchip.ask{background:#fff;color:#1a0001;border-color:transparent;font-weight:500}
.wchip.ask:hover{background:rgba(255,255,255,.88)}

/* English (LTR) */
[dir="ltr"] .whero,[dir="ltr"] #heroBody{margin-inline:auto 0}
[dir="ltr"] .crumb::after{content:" ›"}
[dir="ltr"] svg.i.flip{transform:scaleX(-1)}
html[data-lang="en"] body{letter-spacing:0}
</style>

/* ---------- ذخیره‌سازی ---------- */
var cloudDoc=null,pushT=null;
function loadLocal(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cloudDoc){clearTimeout(pushT);pushT=setTimeout(pushCloud,900)}
}
function saveRun(){try{if(R)localStorage.setItem(RUNKEY,JSON.stringify(R));else localStorage.removeItem(RUNKEY)}catch(e){}}
function pushCloud(){if(!cloudDoc)return;cloudDoc.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).then(function(){setSync("cloud")},function(){setSync("local")})}
function setSync(v){ui.sync=v;var e=$("sync");if(e)e.textContent=syncText()}
function syncText(){return ui.sync==="cloud"?""+_t("در حساب Claude تو ذخیره می‌شود")+"":""+_t("روی همین مرورگر ذخیره می‌شود")+""}
function initCloud(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use("sample").then(function(f){if(f){ui.ai=f;if(ui.tab==="goals")render()}},function(){});
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    if(!r[0]||!r[1])return;
    return r[1].id().then(function(id){
      if(!id)return;
      cloudDoc=r[0].collection("data/users/"+id).doc("planner");
      return cloudDoc.get().then(function(snap){
        var d=snap.exists&&snap.data();
        if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(d.json));ui.moved=replan();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
        else if(S.updatedAt)pushCloud();
        setSync("cloud");
      });
    });
  }).catch(function(){setSync("local")});
}
function normalize(s){
  var b=seed();
  Object.keys(b).forEach(function(k){if(s[k]==null)s[k]=b[k]});
  s.settings=Object.assign({},b.settings,s.settings);s.v=2;
  // کارهای تیک‌خورده‌ی قدیمی‌تر از ۹۰ روز به خلاصه‌ی ماهانه می‌روند
  var cut=addDays(today(),-90);
  s.tasks=s.tasks.filter(function(t){
    if(!(t.done&&t.doneAt&&t.doneAt<cut))return true;
    var m=t.doneAt.slice(0,7),a=s.arch[m]||(s.arch[m]={n:0,min:0});a.n++;a.min+=t.min||0;return false});
  var cut2=addDays(today(),-400);s.log=s.log.filter(function(l){return l.d>=cut2});
  s.books.forEach(function(b){if(!b.notes)b.notes=[];if(b.img&&!bimg(b))delete b.img});
  s.joys.forEach(function(j){if(j.img&&!bimg(j))delete j.img});
  s.courses.forEach(function(c){if(!c.perDay)c.perDay=1;c.url=cleanUrl(c.url);if(c.auto)autoPW(c,s.tasks)});
  Object.keys(s.feel).forEach(function(k){var v=+s.feel[k];if(!(v>=1&&v<=5))delete s.feel[k];else s.feel[k]=v});
  return s;
}

/* ---------- برنامه‌ریز ---------- */
function isOff(d){return S.off.indexOf(d)>=0}
function fixedOn(d){
  var w=dow(d),out=[];
  S.classes.forEach(function(c){if(c.day===w)out.push({id:c.id,title:c.title,start:c.start,end:c.end,kind:""+_t("کلاس")+""})});
  S.meetings.forEach(function(m){if(m.weekly?m.day===w:m.date===d)out.push({id:m.id,title:m.title,start:m.start,end:m.end,kind:""+_t("جلسه")+""})});
  return out.sort(function(a,b){return mins(a.start)-mins(b.start)});
}
function capacity(d){
  if(isOff(d))return 0;
  var awake=(mins(S.settings.sleep)-mins(S.settings.wake)+1440)%1440||960;
  var fx=fixedOn(d).reduce(function(a,f){return a+Math.max(0,mins(f.end)-mins(f.start))},0);
  return Math.max(0,Math.min(S.settings.focus,Math.round((awake-fx-240)*0.5)));
}
function course(id){return by(S.courses,id)}
function live(t){return !t.done&&!t.parked&&!t.hold}
function replan(){
  var t0=today(),load={},moved=0,F=S.settings.factor||1.25;
  var L=function(d){return load[d]||(load[d]={m:0,n:0,src:{}})};
  var put=function(t,d){var l=L(d);l.m+=t.min*F;l.n++;if(t.src)l.src[t.src]=(l.src[t.src]||0)+1;t.date=d};
  var cd={};var gapOk=function(t,d,c){var g=Math.max(1,Math.floor(7/Math.ceil((c.perWeek||3)/(c.perDay||1))));return !(cd[t.src]||[]).some(function(x){return x!==d&&Math.abs(diff(d,x))<g})};var wk={};var wkey=function(t,d){return t.src+"|"+weekStart(d)};
  var open=S.tasks.filter(live);
  var keep=[],move=[];
  open.forEach(function(t){
    if(t.date&&t.date>=t0&&!isOff(t.date)&&!(t.notBefore&&t.date<t.notBefore))keep.push(t);else move.push(t)});
  keep.forEach(function(t){put(t,t.date);if(t.kind==="course"){wk[wkey(t,t.date)]=(wk[wkey(t,t.date)]||0)+1;(cd[t.src]=cd[t.src]||[]).push(t.date)}});
  move.sort(function(a,b){return (a.due||"9").localeCompare(b.due||"9")||(a.date||"9").localeCompare(b.date||"9")||((a.seq||0)-(b.seq||0))});
  move.forEach(function(t){
    if(t.date&&t.date<t0){moved++;t.moved=(t.moved||0)+1;
      // بازگشت آرام: کاری که دو بار عقب افتاده بی‌صدا نمی‌چرخد
      if(t.moved>=2&&t.kind!=="course"){t.hold=true;t.date=null;moved--;return}}
    var d=t.notBefore&&t.notBefore>t0?t.notBefore:t0,c=t.kind==="course"?course(t.src):null,i;
    for(i=0;i<400;i++,d=addDays(d,1)){
      var cap=capacity(d),l=L(d);
      if(cap<=0||l.n>=S.settings.maxTasks)continue;
      if(l.m>0&&l.m+t.min*F>cap)continue;
      if(t.src&&(l.src[t.src]||0)>=(c?(c.perDay||1):1))continue;
      if(c&&((wk[wkey(t,d)]||0)>=(c.perWeek||3)||!gapOk(t,d,c)))continue;
      break;
    }
    put(t,d);if(c){wk[wkey(t,d)]=(wk[wkey(t,d)]||0)+1;(cd[t.src]=cd[t.src]||[]).push(d)}
  });
  // ترتیب قدم‌های هر هدف یا دوره حفظ شود
  var groups={};S.tasks.filter(live).forEach(function(t){if(t.src&&t.date)(groups[t.src]=groups[t.src]||[]).push(t)});
  Object.keys(groups).forEach(function(k){var g=groups[k],ds=g.map(function(t){return t.date}).sort();
    g.sort(function(a,b){return (a.seq||0)-(b.seq||0)}).forEach(function(t,i){t.date=ds[i]})});
  return moved;
}

  }

/* ---------- خط زمانی ---------- */
function nowM(){var d=new Date(),m=d.getHours()*60+d.getMinutes();return m<240?m+1440:m}
function timeline(){
  var t=today(),K=1.4,now=nowM(),wake=mins(S.settings.wake),sleep=mins(S.settings.sleep);if(sleep<=wake)sleep+=1440;
  var start=Math.floor(Math.min(now,Math.max(now,wake))/60)*60,end=Math.max(sleep,start+180);
  if(now>=end)return '<div class="card"><p class="muted small">'+_t("روز تمام شده. فردا خط زمانی تازه می‌آید.")+'</p></div>';
  var fx=fixedOn(t).map(function(f){return {s:mins(f.start),e:mins(f.end),title:f.title}}).filter(function(f){return f.e>start});
  var cur=Math.max(now,wake),placed=[],left=[];
  todayTasks().forEach(function(x){
    var s=cur,ok=false,g;
    for(g=0;g<20&&!ok;g++){ok=true;fx.forEach(function(f){if(s<f.e+10&&s+x.min>f.s-5){s=f.e+10;ok=false}})}
    if(s+x.min>end)left.push(x);else{placed.push({s:s,e:s+x.min,title:x.title,id:x.id});cur=s+x.min+10}
  });
  var H=(end-start)*K,h='<div class="tl" style="height:'+Math.round(H)+'px">',m;
  for(m=start;m<end;m+=60)h+='<div class="hr" style="top:'+Math.round((m-start)*K)+'px">'+fa(hm(m))+'</div>';
  fx.forEach(function(f){var s=Math.max(f.s,start);h+='<div class="blk fx" style="top:'+Math.round((s-start)*K)+'px;height:'+Math.max(22,Math.round((f.e-s)*K)-2)+'px" title="'+esc(f.title)+'">'+fa(hm(f.s))+' '+esc(f.title)+'</div>'});
  placed.forEach(function(p){h+='<div class="blk tk" style="top:'+Math.round((p.s-start)*K)+'px;height:'+Math.max(22,Math.round((p.e-p.s)*K)-2)+'px" title="'+_t("زمان پیشنهادی")+'">'+fa(hm(p.s))+' '+esc(p.title)+'</div>'});
  h+='<div class="now" style="top:'+Math.round((now-start)*K)+'px"><span>'+_t("الان")+'</span></div></div>';
  h+='<div class="legend"><span><i style="background:var(--fg)"></i>'+_t("قطعی")+'</span><span><i style="border:1.5px dashed var(--accent);background:var(--accent-soft)"></i>'+_t("زمان پیشنهادی کار")+'</span></div>';
  if(left.length)h+='<p class="small muted">'+_t("فعلاً جا نمی‌شود:")+' '+left.map(function(x){return esc(x.title)}).join(""+_t("،")+" ")+'</p>';
  return h;
}

/* ---------- تایمر و حالت تمرکز ---------- */
function elapsed(){return R?R.acc+(R.since?(Date.now()-R.since)/1000:0):0}
function startRun(kind,id,m){
  if(R&&R.kind==="book"){ui.focus=true;drawRun();ui.msg=""+_t("اول نوبت مطالعه‌ی فعلی را تمام کن.")+"";return}
  if(R)endTaskRun();
  R={kind:kind,id:id,target:(m||0)*60,acc:0,since:Date.now(),over:false};saveRun();ui.focus=true;drawRun();
}
function endTaskRun(){
  if(!R||R.kind!=="task")return;var el=Math.round(elapsed()),t=task(R.id);
  if(t&&el>=20){t.actual=(t.actual||0)+el;S.log.push({d:today(),id:t.id,sec:el})}
  R=null;saveRun();
}
function drawRun(){
  var bar=$("timer"),fo=$("focus");
  if(!R){bar.hidden=true;fo.hidden=true;$("fab").hidden=false;return}
  var isB=R.kind==="book",x=isB?book(R.id):task(R.id);
  if(!x){R=null;saveRun();bar.hidden=true;fo.hidden=true;return}
  bar.hidden=ui.focus;fo.hidden=!ui.focus;$("fab").hidden=ui.focus;
  var paused=!R.since,C=2*Math.PI*70;
  if(!ui.focus){bar.innerHTML='<span>'+esc(x.title)+'</span><b id="bt"></b>'+btn("f-open",""+_t("باز کن")+"","","pri")+btn("t-pause",paused?""+_t("ادامه")+"":""+_t("مکث")+"")+(isB?btn("r-stop",""+_t("توقف و ثبت")+""):btn("t-done",""+_t("تمام شد، تیک بزن")+""));tickRun();return}
  var h='<div class="box"><p class="muted small">'+(isB?""+_t("در حال مطالعه")+"":""+_t("فقط همین یک کار")+"")+'</p><h1>'+esc(x.title)+'</h1>';
  if(!isB&&x.kind==="course"&&course(x.src)&&course(x.src).url)h+='<div class="row" style="justify-content:center">'+courseLink(course(x.src))+'</div>';
  if(!isB)h+='<p>'+(x.next?""+_t("قدم بعدی:")+" <b>"+esc(x.next)+"</b>":'<span class="muted">'+_t("فقط شروع کن. لازم نیست تمامش کنی.")+'</span>')+'</p>';
  else h+='<p class="muted">'+(x.page?""+_t("از صفحه‌ی")+" "+fa(x.page):"")+(x.author?" · "+esc(x.author):"")+'</p>';
  h+='<div class="ringwrap"><svg class="ringbig" width="170" height="170" viewBox="0 0 170 170" aria-hidden="true"><circle class="bg" cx="85" cy="85" r="70"/><circle class="fg" id="fr" cx="85" cy="85" r="70" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 85 85)"/></svg><div class="clock" id="ft"></div></div>';
  if(isB){
    h+='<p class="muted small" id="fnote">'+(R.target?""+_t("هدف این نوبت:")+" "+dur(R.target/60):"")+'</p><div class="row" style="justify-content:center">'+btn("t-pause",paused?""+_t("ادامه")+"":""+_t("مکث")+"","","big")+btn("r-stop",""+_t("توقف و ثبت")+"","","pri big")+'</div>'+
      '<form data-form="rnote"><label>'+_t("نوع")+'<select name="t" id="rn-t">'+opts([["q",""+_t("نقل‌قول")+""],["th",""+_t("فکر")+""],["w",""+_t("واژه")+""]])+'</select></label><label class="grow">'+_t("یادداشت حین مطالعه")+'<input name="text" id="rn-text" required></label><button class="btn">'+_t("ثبت")+'</button></form>';
  }else if(R.over){
    h+='<p>'+_t("زمان تمام شد. شروع کردی و این سخت‌ترین بخشش بود.")+'</p><div class="row" style="justify-content:center">'+btn("t-more",""+_t("۲۰ دقیقه‌ی دیگر ادامه می‌دهم")+"","","pri big")+btn("t-done",""+_t("تمام شد، تیک بزن")+"","","big")+btn("t-later",""+_t("بعداً ادامه می‌دهم")+"","","big")+'</div>';
  }else{
    h+='<div class="row" style="justify-content:center">'+btn("t-pause",paused?""+_t("ادامه")+"":""+_t("مکث")+"","","big")+btn("t-done",""+_t("تمام شد، تیک بزن")+"","","pri big")+btn("t-later",""+_t("بعداً ادامه می‌دهم")+"","","big")+'</div><div class="row" style="justify-content:center">'+btn("stuck",""+_t("گیر کردم")+"",{id:x.id})+btn("next",""+_t("قدم بعدی")+"",{id:x.id})+btn("t-swap",""+_t("کار دیگری پیشنهاد بده")+"")+'</div>';
  }
  if(!isB)h+='<form data-form="capture"><label class="grow">'+_t("فکر مزاحم؟ بنویس و برگرد سر کار")+'<input name="text" id="fc-text" required></label><button class="btn">'+_t("ثبت")+'</button></form>';
  h+='<div class="row" style="justify-content:center">'+btn("f-min",""+_t("کوچک کن و برگرد به پلنر")+"")+'</div></div>';
  fo.innerHTML=h;tickRun();
}
function tickRun(){
  if(!R)return;var el=elapsed(),isB=R.kind==="book",C=2*Math.PI*70,txt,frac;
  if(isB){txt=clock(el);frac=R.target?Math.min(1,el/R.target):0;var fn=$("fnote");if(fn&&R.target&&el>=R.target)fn.textContent=""+_t("به هدف این نوبت رسیدی. هر وقت خواستی توقف کن.")+""}
  else{var left=R.target-el;if(left<=0&&!R.over){R.over=true;saveRun();drawRun();return}txt=clock(Math.max(0,left));frac=R.target?Math.max(0,left/R.target):0}
  var a=$("ft"),b=$("bt"),r=$("fr");if(a)a.textContent=txt;if(b)b.textContent=txt;if(r)r.setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(1));
}

function setDone(t,v){if(v&&R&&R.kind==="task"&&R.id===t.id){endTaskRun();drawRun()}t.done=v;t.doneAt=v?today():null;if(v){delete t.resume;t.hold=false;t.parked=false}}

    t.title=""+_t("قدم اول ده دقیقه‌ای:")+" "+t.title;t.min=10}
  t.moved=0;t.hold=false;t.parked=false;
}

function progTiles(k){

    var nx=ts.filter(function(x){return live(x)&&x.date}).sort(function(a,b){return a.date.localeCompare(b.date)})[0];
    var due=S.goals.filter(function(g){return g.due&&g.due>=t}).sort(function(a,b){return a.due.localeCompare(b.due)})[0];
    h=tile(fa(S.goals.length),""+_t("هدف در جریان")+"","","hot")+tile(fa(dn)+'<i> '+_t("از")+' '+fa(ts.length)+'</i>',""+_t("قدم برداشته‌شده")+"",ts.length?fa(Math.round(dn/ts.length*100))+""+_t("٪ از کل راه")+"":"")+

  }else if(k==="courses"){

    var cs=S.tasks.filter(function(x){return cid[x.src]}),cd=cs.filter(function(x){return x.done}).length,rem=cs.filter(function(x){return !x.done}).reduce(function(a,x){return a+x.min},0);

    h=tile(fa(S.courses.length),""+_t("دوره")+"","","hot")+tile(fa(cs.length?Math.round(cd/cs.length*100):0)+""+_t("٪")+"",""+_t("دیده شده")+"",fa(cd)+" "+_t("از")+" "+fa(cs.length)+" "+_t("بخش")+"")+tile(rem?dur(rem):fa(0),""+_t("مانده تا پایان همه")+"","","txt")+tile(fa(wk),""+_t("بخش تا آخر این هفته")+"");
  }else if(k==="fixed"){

    var nxt=null,i,d;for(i=0;i<8&&!nxt;i++){d=addDays(t,i);nxt=fixedOn(d).filter(function(f){return i>0||mins(f.start)>nowM()})[0];if(nxt)nxt={f:nxt,d:d,i:i}}

      tile(nxt?esc(nxt.f.title):""+_t("ندارد")+"",""+_t("بعدی")+"",nxt?(nxt.i===0?""+_t("امروز")+"":nxt.i===1?""+_t("فردا")+"":DAYS[dow(nxt.d)])+" "+fa(nxt.f.start):"","txt");

  if(ns.length>=3)h+='<p>'+(dev<=30?""+_t("ساعت خوابیدنت منظم است")+"":dev<=60?""+_t("ساعت خوابیدنت کمی جابه‌جا می‌شود")+"":""+_t("ساعت خوابیدنت شب به شب خیلی فرق می‌کند")+"")+" ("+_t("به‌طور میانگین")+" <b>"+dur(dev)+"</b> "+_t("جابه‌جایی). ساعت خوابِ ثابت معمولاً بیشتر از طول خواب روی انرژی روز اثر دارد.")+""+'</p>';
  var gd=ns.filter(function(x){return x.m>=g-20}),sh=ns.filter(function(x){return x.m<g-20}),cnt=function(l){return l.reduce(function(a,x){return a+S.tasks.filter(function(k){return k.done&&k.doneAt===x.d}).length},0)/l.length};
  var fl=function(l){var v=l.map(function(x){return S.feel[x.d]}).filter(Boolean);return v.length?v.reduce(function(a,b){return a+b},0)/v.length:0};
  if(gd.length>=2&&sh.length>=2){var a=cnt(gd),b=cnt(sh),fa1=fl(gd),fb=fl(sh);
    h+='<div class="note"><span>'+_t("بعد از شب‌هایی که به هدف خواب رسیدی، میانگین")+' <b>'+fa(+a.toFixed(1))+'</b> '+_t("کار تیک زدی و بعد از شب‌های کم‌خواب")+' <b>'+fa(+b.toFixed(1))+'</b> '+_t("کار.")+''+(fa1&&fb?" "+_t("حال روز هم")+" "+(fa1>fb+0.3?""+_t("بعد از خواب کافی بهتر بوده.")+"":fb>fa1+0.3?""+_t("بعد از شب‌های کوتاه‌تر بهتر بوده.")+"":""+_t("تقریباً یکسان بوده.")+""):"")+'</span></div>'}
  else h+='<p class="muted small">'+_t("وقتی دست‌کم دو شبِ کافی و دو شبِ کم‌خواب ثبت شود، اینجا می‌بینی خواب روی تعداد کارها و حال روزت چه اثری داشته.")+'</p>';
  return h+'</div>'}
(function(){var d0=VIEWS.dash;VIEWS.dash=function(){var h=d0(),t=today(),n=ui.range||7,days=[],i;for(i=n-1;i>=0;i--)days.push(addDays(t,-i));
  var a=h.indexOf('<div class="card">'),b=a<0?-1:h.indexOf('<div class="card">',a+10);return b<0?h+slCard(days):h.slice(0,b)+slCard(days)+h.slice(b)}})();
